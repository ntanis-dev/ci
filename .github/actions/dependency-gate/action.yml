name: Gate dependency advisories
description: Scans the checked-out repository with OSV-Scanner and fails only on advisories someone has to act on. Fixes younger than the two-week release age and advisories accepted in ntanis-dev/ci are reported without failing.
inputs:
  path:
    description: Directory to scan recursively
    required: false
    default: '.'
  fail-severity:
    description: Lowest severity that fails (low, moderate, high, critical), or none to only report
    required: false
    default: low
  exclude:
    description: Newline-separated repository paths whose lockfiles are not part of anything that ships
    required: false
    default: ''
  result-file:
    description: Where the JSON classification is written
    required: false
    default: dependency-scan.json
runs:
  using: composite
  steps:
    - name: Install OSV-Scanner 2.3.8
      shell: bash
      run: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 --retry 3 -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
        echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  $RUNNER_TEMP/osv-scanner" | sha256sum --check --quiet
        chmod +x "$RUNNER_TEMP/osv-scanner"
    - name: Scan the dependency tree
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      run: |
        set +e
        "$RUNNER_TEMP/osv-scanner" scan source -r --format json --output="$RUNNER_TEMP/osv.json" "$SCAN_PATH"
        status=$?
        set -e
        # 0: nothing found, 1: vulnerabilities found (classified next), 128: no packages to scan.
        case "$status" in 0|1|128) ;; *) echo "::error::OSV-Scanner failed with exit code $status"; exit "$status" ;; esac
    - name: Classify the findings
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_SEVERITY: ${{ inputs.fail-severity }}
        RESULT_FILE: ${{ inputs.result-file }}
        DEPENDENCY_GATE_EXCLUDE: ${{ inputs.exclude }}
      run: node "$GITHUB_ACTION_PATH/gate.mjs" --osv "$RUNNER_TEMP/osv.json" --root "$SCAN_PATH" --threshold "$FAIL_SEVERITY" --result "$RESULT_FILE"
