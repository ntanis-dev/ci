name: Build and deploy Kubernetes project container

on:
  workflow_call:
    inputs:
      project:
        description: Approved Hub project identifier
        required: true
        type: string
      component:
        description: Automatic hosted component identifier
        required: true
        type: string
      deploy:
        description: Submit the immutable image digest to Hub after publishing
        required: false
        default: false
        type: boolean

concurrency:
  group: ntanis-container-${{ inputs.project }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
      image-repository: ${{ steps.contract.outputs.image-repository }}
      environment-b64: ${{ steps.contract.outputs.environment-b64 }}
      data-contract-b64: ${{ steps.contract.outputs.data-contract-b64 }}
      realtime-contract-b64: ${{ steps.contract.outputs.realtime-contract-b64 }}
    steps:
      - name: Check out verified project source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Verify Git LFS objects are materialized
        run: |
          git lfs fsck
          git lfs ls-files --json | jq -e 'all(.files[]; .checkout == true and .downloaded == true)'

      - id: contract
        name: Validate the bounded Kubernetes contract
        env:
          COMPONENT: ${{ inputs.component }}
          PROJECT: ${{ inputs.project }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('ntanis.project.json', 'utf8'))
          const legacy = manifest.schemaVersion === 1
          const modern = [2, 3].includes(manifest.schemaVersion)
          const project = legacy ? manifest.project : manifest.project?.id
          const component = (legacy ? manifest.components : manifest.hosting?.components)?.find((candidate) => candidate?.id === process.env.COMPONENT)
          const expectedImage = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`
          if ((!legacy && !modern) || project !== process.env.PROJECT || !component || component.deployment !== 'automatic'
            || (legacy && (component.type !== 'hosted' || component.repository !== process.env.GITHUB_REPOSITORY || component.ref !== 'refs/heads/main'))
            || (modern && component.imageRepository !== expectedImage)) {
            throw new Error('Invalid Kubernetes component manifest')
          }
          const realtime = manifest.realtime
            ? { contractVersion: manifest.realtime.contractVersion, backend: manifest.realtime.backend, channels: manifest.realtime.channels.filter((channel) => channel.component === process.env.COMPONENT) }
            : null
          const output = (name, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${Buffer.from(JSON.stringify(value)).toString('base64')}\n`)
          output('environment-b64', legacy ? component.environment ?? [] : (manifest.secrets ?? []).map((entry) => ({
            name: entry.name,
            description: entry.purpose,
            required: entry.required,
            sensitive: entry.type === 'secret',
            type: entry.type === 'secret' ? 'secret' : 'string'
          })))
          output('data-contract-b64', manifest.data
            ? { ...manifest.data, project, schemaVersion: 1 }
            : null)
          output('realtime-contract-b64', realtime)
          NODE
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image-repository=$image_repository" >> "$GITHUB_OUTPUT"

      - name: Enforce the language-neutral container boundary
        run: |
          test -f Dockerfile
          test ! -L Dockerfile
          test -f .dockerignore
          if awk 'toupper($1) == "FROM" && $2 !~ /@sha256:[0-9a-f]{64}$/ { exit 1 }' Dockerfile; then
            :
          else
            echo 'Every Dockerfile base image must use an immutable sha256 digest.' >&2
            exit 1
          fi

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - id: image
        name: Build and push the immutable image
        env:
          IMAGE_REPOSITORY: ${{ steps.contract.outputs.image-repository }}
        run: |
          metadata="$RUNNER_TEMP/image-metadata.json"
          docker buildx build --pull --push --platform linux/amd64 \
            --metadata-file "$metadata" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_REPOSITORY:$GITHUB_SHA" .
          digest="$(jq -r '."containerimage.digest"' "$metadata")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE_REPOSITORY@$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Queue the verified digest and wait for the health gate
        env:
          COMPONENT: ${{ inputs.component }}
          DATA_CONTRACT_B64: ${{ needs.build.outputs.data-contract-b64 }}
          ENVIRONMENT_B64: ${{ needs.build.outputs.environment-b64 }}
          HUB_AUDIENCE: https://api.ntanis.dev/project-deployments
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image-repository }}
          PROJECT: ${{ inputs.project }}
          REALTIME_CONTRACT_B64: ${{ needs.build.outputs.realtime-contract-b64 }}
        run: |
          oidc_token() {
            local url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(printf '%s' "$HUB_AUDIENCE" | jq -sRr @uri)"
            curl --fail --silent --show-error --retry 3 \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$url" | jq -er .value
          }
          hub_post() {
            local endpoint="$1"
            local body="$2"
            local output="$3"
            local code
            code="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --output "$output" --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" \
              --header 'Content-Type: application/json' \
              --data "$body" "$endpoint")"
            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
              local error
              error="$(jq -r 'if (.error | type) == "string" then .error else "unknown_error" end' "$output" 2>/dev/null || printf unknown_error)"
              echo "Hub deployment request rejected (HTTP $code): $error" >&2
              return 1
            fi
          }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$IMAGE_REPOSITORY" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+$ ]]
          environment="$(printf '%s' "$ENVIRONMENT_B64" | base64 --decode | jq -ec .)"
          data_contract="$(printf '%s' "$DATA_CONTRACT_B64" | base64 --decode | jq -c .)"
          realtime_contract="$(printf '%s' "$REALTIME_CONTRACT_B64" | base64 --decode | jq -c .)"
          payload="$(jq -cn \
            --arg commit "$GITHUB_SHA" \
            --arg imageRepository "$IMAGE_REPOSITORY" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --argjson environment "$environment" \
            --argjson dataContract "$data_contract" \
            --argjson realtimeContract "$realtime_contract" \
            '{commit:$commit,imageRepository:$imageRepository,imageDigest:$imageDigest,environment:$environment,dataContract:$dataContract,realtimeContract:$realtimeContract}')"
          token="$(oidc_token)"
          response="$RUNNER_TEMP/hub-deployment-response.json"
          hub_post "https://api.ntanis.dev/v1/deployment-requests/$PROJECT/$COMPONENT" "$payload" "$response"
          request_id="$(jq -er .deploymentRequest.id "$response")"
          for _ in $(seq 1 60); do
            token="$(oidc_token)"
            status_payload="$(jq -cn --arg commit "$GITHUB_SHA" '{commit:$commit}')"
            hub_post "https://api.ntanis.dev/v1/deployment-requests/$PROJECT/$COMPONENT/$request_id/status" "$status_payload" "$response"
            status="$(<"$response")"
            state="$(printf '%s' "$status" | jq -er .deploymentRequest.status)"
            case "$state" in
              healthy) exit 0 ;;
              failed) printf '%s' "$status" | jq -r '.deploymentRequest.failure_code // "deployment_failed"' >&2; exit 1 ;;
              queued|deploying) sleep 10 ;;
              *) echo 'Hub returned an invalid deployment state.' >&2; exit 1 ;;
            esac
          done
          echo 'Timed out waiting for the Kubernetes deployment.' >&2
          exit 1
