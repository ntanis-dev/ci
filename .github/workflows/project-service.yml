name: Build and deploy project service

concurrency:
  group: ntanis-service-${{ inputs.project }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      project:
        description: Supported ntanis.dev service identifier
        required: true
        type: string
      deploy:
        description: Deploy the verified build to its isolated project guest
        required: false
        default: false
        type: boolean
      server-host:
        description: SSH ingress host
        required: false
        default: 5.9.21.198
        type: string
      server-user:
        description: Constrained project deployment account
        required: false
        default: project-ci
        type: string
      server-fingerprint:
        description: Expected SHA256 ED25519 host-key fingerprint
        required: true
        type: string
    secrets:
      server-ssh-key:
        description: Private key accepted only by the constrained project deployment account
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate service contract
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          case "$PROJECT" in
            tempo|justdoit|lyrical|djtube) ;;
            *) echo 'Unsupported project service.' >&2; exit 2 ;;
          esac

      - name: Check out project source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate hosted component policy
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('ntanis.project.json','utf8')); if(m.schemaVersion!==1||m.project!==process.env.PROJECT||!Array.isArray(m.components)||!m.components.some(c=>c&&c.id==='service'&&c.type==='hosted'&&c.deployment==='automatic'&&c.healthPath==='/health'&&c.repository===process.env.GITHUB_REPOSITORY&&c.ref==='refs/heads/main')) throw new Error('Missing automatic hosted service policy')"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile

      - name: Enforce the repository supply-chain policy
        run: pnpm run security:check

      - name: Verify registry signatures
        run: pnpm run security:signatures

      - name: Reject known high-severity production vulnerabilities
        run: pnpm run security:vulnerabilities

      - name: Verify and build
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          case "$PROJECT" in
            tempo) pnpm run check ;;
            justdoit) pnpm run typecheck ;;
            lyrical) pnpm run check ;;
            djtube) pnpm run lint ;;
            *) exit 2 ;;
          esac
          if [ "$PROJECT" != lyrical ]; then pnpm run build; fi

      - name: Assemble the bounded runtime
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          pnpm sbom --prod --lockfile-only --sbom-format cyclonedx --sbom-spec-version 1.6 --sbom-type application --out ntanis-project.sbom.cdx.json
          pnpm prune --prod
          case "$PROJECT" in
            tempo)
              test -f dist/server/index.js
              test -f dist/client/index.html
              tar -czf project-runtime.tar.gz dist package.json pnpm-lock.yaml pnpm-workspace.yaml node_modules ntanis-project.sbom.cdx.json
              ;;
            justdoit)
              test -f server-dist/index.js
              test -f dist/index.html
              tar -czf project-runtime.tar.gz dist server-dist package.json pnpm-lock.yaml pnpm-workspace.yaml node_modules ntanis-project.sbom.cdx.json
              ;;
            lyrical)
              test -f server.js
              test -f public/index.html
              tar -czf project-runtime.tar.gz server.js lib public package.json pnpm-lock.yaml pnpm-workspace.yaml node_modules ntanis-project.sbom.cdx.json
              ;;
            djtube)
              test -f server-dist/index.js
              test -f dist/index.html
              tar -czf project-runtime.tar.gz dist server-dist locales package.json pnpm-lock.yaml pnpm-workspace.yaml node_modules ntanis-project.sbom.cdx.json
              ;;
            *) exit 2 ;;
          esac
          sha256sum project-runtime.tar.gz > project-runtime.tar.gz.sha256

      - name: Transfer the runtime without deployment credentials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-runtime
          path: |
            project-runtime.tar.gz
            project-runtime.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the runtime without executing it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-runtime

      - name: Verify transferred bytes
        run: sha256sum --check project-runtime.tar.gz.sha256

      - name: Configure pinned SSH transport
        env:
          SERVER_FINGERPRINT: ${{ inputs.server-fingerprint }}
          SERVER_HOST: ${{ inputs.server-host }}
          SERVER_SSH_KEY: ${{ secrets.server-ssh-key }}
          SERVER_USER: ${{ inputs.server-user }}
        run: |
          test -n "$SERVER_HOST"
          test "$SERVER_USER" = project-ci
          test -n "$SERVER_FINGERPRINT"
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$SERVER_HOST" > ~/.ssh/known_hosts.scan
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts.scan -E sha256 | awk '{print $2}')"
          test "$actual" = "$SERVER_FINGERPRINT"
          mv ~/.ssh/known_hosts.scan ~/.ssh/known_hosts

      - id: deploy
        name: Deploy with local and public health verification and rollback
        continue-on-error: true
        env:
          PROJECT: ${{ inputs.project }}
          RELEASE_ID: ${{ github.sha }}
          SERVER_HOST: ${{ inputs.server-host }}
          SERVER_USER: ${{ inputs.server-user }}
        run: |
          case "$PROJECT" in tempo|justdoit|lyrical|djtube) ;; *) exit 2 ;; esac
          test "${#RELEASE_ID}" -eq 40
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          artifact_sha256="$(sha256sum project-runtime.tar.gz | awk '{print $1}')"
          status=healthy
          failure_code=''
          if ! ssh "$SERVER_USER@$SERVER_HOST" "upload $PROJECT $RELEASE_ID" < project-runtime.tar.gz; then
            status=failed
            failure_code=upload_failed
          elif ! ssh "$SERVER_USER@$SERVER_HOST" "deploy $PROJECT $RELEASE_ID"; then
            status=failed
            failure_code=health_or_deploy_failed
          fi
          {
            echo "artifact-sha256=$artifact_sha256"
            echo "failure-code=$failure_code"
            echo "started-at=$started_at"
            echo "status=$status"
          } >> "$GITHUB_OUTPUT"
          test "$status" = healthy

      - name: Report the immutable deployment outcome to Hub
        if: always() && steps.deploy.outputs.status != ''
        env:
          ARTIFACT_SHA256: ${{ steps.deploy.outputs.artifact-sha256 }}
          FAILURE_CODE: ${{ steps.deploy.outputs.failure-code }}
          HUB_AUDIENCE: https://api.ntanis.dev/project-deployments
          PROJECT: ${{ inputs.project }}
          STARTED_AT: ${{ steps.deploy.outputs.started-at }}
          STATUS: ${{ steps.deploy.outputs.status }}
        run: |
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(printf '%s' "$HUB_AUDIENCE" | jq -sRr @uri)"
          oidc_token="$(curl --fail --silent --show-error --retry 3 --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$oidc_url" | jq -er .value)"
          payload="$(jq -cn \
            --arg artifactSha256 "$ARTIFACT_SHA256" \
            --arg commit "$GITHUB_SHA" \
            --arg failureCode "$FAILURE_CODE" \
            --arg finishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg startedAt "$STARTED_AT" \
            --arg status "$STATUS" \
            '{artifactSha256:$artifactSha256,commit:$commit,finishedAt:$finishedAt,startedAt:$startedAt,status:$status} + (if $failureCode == "" then {} else {failureCode:$failureCode} end)')"
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $oidc_token" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.ntanis.dev/v1/deployments/$PROJECT/service"

      - name: Preserve failed deployment status
        if: always() && steps.deploy.outputs.status == 'failed'
        run: exit 1
