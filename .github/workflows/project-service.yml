name: Build and deploy project service

concurrency:
  group: ntanis-service-${{ inputs.project }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      project:
        description: Supported ntanis.dev service identifier
        required: true
        type: string
      deploy:
        description: Deploy the verified build to its isolated project guest
        required: false
        default: false
        type: boolean
      server-host:
        description: SSH ingress host
        required: false
        default: 5.9.21.198
        type: string
      server-user:
        description: Constrained project deployment account
        required: false
        default: project-ci
        type: string
      server-fingerprint:
        description: Expected SHA256 ED25519 host-key fingerprint
        required: true
        type: string
    secrets:
      server-ssh-key:
        description: Private key accepted only by the constrained project deployment account
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate service contract
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          case "$PROJECT" in
            tempo|justdoit|lyrical|djtube) ;;
            *) echo 'Unsupported project service.' >&2; exit 2 ;;
          esac

      - name: Check out project source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enforce the central supply-chain policy
        uses: ntanis-dev/ci/.github/actions/pnpm-supply-chain@f8b4a4d53f59866e8b06200c6cd930938a8dc5b4

      - name: Validate optional PWA application contract
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const manifest = JSON.parse(fs.readFileSync('ntanis.project.json', 'utf8'))
          const applications = manifest.applications ?? []
          if (!Array.isArray(applications) || applications.length > 4) throw new Error('Invalid application declarations')
          const componentIds = new Set((manifest.schemaVersion === 2 ? manifest.hosting?.components ?? [] : manifest.components ?? []).filter((item) => manifest.schemaVersion === 2 ? item?.kind !== 'worker' : item?.type === 'hosted').map((item) => item.id))
          const applicationIds = new Set()
          const allowed = new Set(['id', 'type', 'contractVersion', 'component', 'basePath', 'manifestPath', 'serviceWorkerPath', 'offline', 'update', 'identity', 'accountState', 'telemetry'])
          const sourcePath = /^(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))[A-Za-z0-9._/-]+$/
          const basePath = /^\/(?:[A-Za-z0-9._~-]+\/)*$/
          const identifier = /^[a-z][a-z0-9-]{0,31}$/
          const repositoryRoot = fs.realpathSync(process.cwd())
          const readBounded = (file, maximum) => {
            if (!sourcePath.test(file)) throw new Error(`Invalid PWA source path: ${file}`)
            const resolved = path.resolve(file)
            const metadata = fs.lstatSync(resolved)
            const real = fs.realpathSync(resolved)
            if (!metadata.isFile() || !real.startsWith(`${repositoryRoot}${path.sep}`) || metadata.size < 1 || metadata.size > maximum) throw new Error(`Invalid PWA source file: ${file}`)
            return fs.readFileSync(real)
          }
          for (const application of applications) {
            if (!application || typeof application !== 'object' || Object.keys(application).some((key) => !allowed.has(key))) throw new Error('Invalid PWA application fields')
            if (!identifier.test(application.id) || applicationIds.has(application.id)) throw new Error('Invalid PWA application identifier')
            applicationIds.add(application.id)
            if (application.type !== 'pwa' || application.contractVersion !== 1 || !componentIds.has(application.component)) throw new Error('Invalid PWA component binding')
            if (typeof application.basePath !== 'string' || !basePath.test(application.basePath) || application.basePath.length > 240) throw new Error('Invalid PWA base path')
            if (!['none', 'shell', 'local-data'].includes(application.offline) || application.update !== 'prompt' || !['none', 'optional', 'required'].includes(application.identity) || !['none', 'hub-entities', 'hub-entities-realtime', 'hub-settings', 'hub-settings-realtime'].includes(application.accountState) || !['none', 'anonymous-local-controls'].includes(application.telemetry)) throw new Error('Invalid PWA capability declaration')
            if (application.identity === 'none' && application.accountState !== 'none') throw new Error('PWA account state requires identity')
            const webManifest = JSON.parse(readBounded(application.manifestPath, 64 * 1024).toString('utf8'))
            if (typeof webManifest.name !== 'string' || !webManifest.name.trim() || typeof webManifest.short_name !== 'string' || !webManifest.short_name.trim() || webManifest.id !== application.basePath || webManifest.scope !== application.basePath || typeof webManifest.start_url !== 'string' || !webManifest.start_url.startsWith(application.basePath) || !['standalone', 'minimal-ui'].includes(webManifest.display) || !/^#[0-9a-f]{6}$/i.test(webManifest.background_color) || !/^#[0-9a-f]{6}$/i.test(webManifest.theme_color)) throw new Error('Invalid installable web manifest')
            const icons = Array.isArray(webManifest.icons) ? webManifest.icons : []
            for (const size of ['192x192', '512x512']) {
              if (!icons.some((icon) => icon?.sizes === size && icon?.type === 'image/png' && typeof icon.src === 'string' && icon.src.startsWith(application.basePath) && typeof icon.purpose === 'string' && icon.purpose.split(/\s+/).includes('maskable'))) throw new Error(`PWA manifest is missing a maskable ${size} PNG icon`)
            }
            const worker = readBounded(application.serviceWorkerPath, 128 * 1024).toString('utf8')
            if (!worker.includes(application.basePath)) throw new Error('PWA service worker is not visibly scoped to its declared base path')
          }
          NODE

      - name: Validate hosted component policy
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('ntanis.project.json','utf8')); const project=m.schemaVersion===2?m.project?.id:m.project; const component=(m.schemaVersion===2?m.hosting?.components:m.components)?.find(c=>c?.id==='service'); if(project!==process.env.PROJECT||!component||component.deployment!=='automatic'||component.healthPath!=='/health'||(m.schemaVersion===1&&(component.type!=='hosted'||component.repository!==process.env.GITHUB_REPOSITORY||component.ref!=='refs/heads/main'))||(m.schemaVersion===2&&(component.imageRepository!==('ghcr.io/'+process.env.GITHUB_REPOSITORY.toLowerCase())))) throw new Error('Missing automatic hosted service policy')"
          node <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('ntanis.project.json', 'utf8'))
          const declarations = manifest.schemaVersion === 2
            ? (manifest.secrets ?? []).map((entry) => ({ name: entry.name, description: entry.purpose, required: entry.required, sensitive: entry.type === 'secret', type: entry.type === 'secret' ? 'secret' : 'string' }))
            : manifest.components.find((component) => component?.id === 'service')?.environment ?? []
          const names = new Set()
          const reserved = new Set(['HOME', 'HOST', 'LANG', 'LD_PRELOAD', 'NODE_ENV', 'PATH', 'PORT', 'PWD', 'SHELL', 'TZ'])
          const prefixes = ['HUB_', 'NTANIS_', 'NODE_', 'NPM_', 'XDG_']
          const types = new Set(['boolean', 'integer', 'secret', 'string', 'url'])
          if (!Array.isArray(declarations) || declarations.length > 100) throw new Error('Invalid environment declarations')
          for (const declaration of declarations) {
            const name = declaration?.name
            if (typeof name !== 'string' || !/^[A-Z][A-Z0-9_]{0,63}$/.test(name) || names.has(name) || reserved.has(name) || prefixes.some((prefix) => name.startsWith(prefix))) throw new Error('Invalid environment declaration name')
            if (typeof declaration.description !== 'string' || !declaration.description.trim() || declaration.description.trim().length > 240 || typeof declaration.required !== 'boolean' || typeof declaration.sensitive !== 'boolean' || !types.has(declaration.type)) throw new Error(`Invalid environment declaration for ${name}`)
            if ((declaration.sensitive || declaration.type === 'secret') && declaration.default !== undefined) throw new Error(`Sensitive declaration ${name} cannot carry a default`)
            if (declaration.default !== undefined && (typeof declaration.default !== 'string' || Buffer.byteLength(declaration.default) > 1024 || declaration.default.includes('\0'))) throw new Error(`Invalid environment default for ${name}`)
            names.add(name)
          }
          NODE

      - name: Validate source-owned data contract
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const projectManifest = JSON.parse(fs.readFileSync('ntanis.project.json', 'utf8'))
          const declaration = projectManifest.data
          const applications = projectManifest.applications ?? []
          const requiresData = applications.some((application) => application?.accountState !== 'none')
          if (!declaration) {
            if (requiresData) throw new Error('Account-backed applications require a source-owned data contract')
            process.exit(0)
          }
          if (typeof declaration !== 'object' || Array.isArray(declaration) || Object.keys(declaration).some((key) => !['contractVersion', 'entities'].includes(key)) || declaration.contractVersion !== 1 || !Array.isArray(declaration.entities) || declaration.entities.length > 256 || Buffer.byteLength(JSON.stringify(declaration)) > 64 * 1024) throw new Error('Invalid data contract declaration')
          const project = projectManifest.schemaVersion === 2 ? projectManifest.project?.id : projectManifest.project
          const contract = { contractVersion: declaration.contractVersion, entities: declaration.entities, project, schemaVersion: 1 }
          const names = new Set()
          for (const entity of contract.entities) {
            if (!entity || typeof entity !== 'object' || Array.isArray(entity) || Object.keys(entity).some((key) => !['definition', 'entityType'].includes(key)) || typeof entity.entityType !== 'string' || !/^[a-z][a-z0-9_]{1,63}$/.test(entity.entityType) || names.has(entity.entityType)) throw new Error('Invalid entity declaration')
            names.add(entity.entityType)
            const definition = entity.definition
            if (!definition || typeof definition !== 'object' || Array.isArray(definition) || Object.keys(definition).some((key) => !['accessPolicy', 'description', 'displayName', 'enabled', 'jsonSchema', 'relationships', 'unique'].includes(key)) || typeof definition.displayName !== 'string' || !definition.displayName.trim() || typeof definition.description !== 'string' || !['authenticated-read', 'capability-read', 'owner', 'public-read', 'service-only'].includes(definition.accessPolicy) || typeof definition.enabled !== 'boolean' || !Array.isArray(definition.relationships) || !Array.isArray(definition.unique) || !definition.jsonSchema || definition.jsonSchema.type !== 'object' || definition.jsonSchema.additionalProperties !== false) throw new Error(`Invalid definition for ${entity.entityType}`)
          }
          for (const entity of contract.entities) for (const relationship of entity.definition.relationships) if (!names.has(relationship?.targetEntity)) throw new Error(`Missing relationship target for ${entity.entityType}`)
          fs.writeFileSync('ntanis-data-contract.json', `${JSON.stringify(contract)}\n`, { flag: 'wx' })
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Reject known high-severity production vulnerabilities
        run: pnpm audit --audit-level high

      - name: Verify and build
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          case "$PROJECT" in
            tempo) pnpm run check ;;
            justdoit) pnpm run check ;;
            lyrical) pnpm run check ;;
            djtube) pnpm run lint ;;
            *) exit 2 ;;
          esac
          if [ "$PROJECT" != lyrical ]; then pnpm run build; fi

      - name: Assemble the bounded runtime
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          pnpm sbom --prod --lockfile-only --sbom-format cyclonedx --sbom-spec-version 1.6 --sbom-type application --out ntanis-project.sbom.cdx.json
          pnpm prune --prod
          case "$PROJECT" in
            tempo)
              test -f dist/server/index.js
              test -f dist/client/index.html
              tar -czf project-runtime.tar.gz dist package.json pnpm-lock.yaml pnpm-workspace.yaml node_modules ntanis-project.sbom.cdx.json
              ;;
            justdoit)
              test -f dist/server/index.js
              test -f dist/web/index.html
              tar -czf project-runtime.tar.gz dist package.json pnpm-lock.yaml pnpm-workspace.yaml node_modules ntanis-project.sbom.cdx.json
              ;;
            lyrical)
              test -f server.js
              test -f public/index.html
              tar -czf project-runtime.tar.gz server.js lib public package.json pnpm-lock.yaml pnpm-workspace.yaml node_modules ntanis-project.sbom.cdx.json
              ;;
            djtube)
              test -f server-dist/index.js
              test -f dist/index.html
              tar -czf project-runtime.tar.gz dist server-dist locales package.json pnpm-lock.yaml pnpm-workspace.yaml node_modules ntanis-project.sbom.cdx.json
              ;;
            *) exit 2 ;;
          esac
          sha256sum project-runtime.tar.gz > project-runtime.tar.gz.sha256

      - name: Transfer the runtime without deployment credentials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-runtime
          path: |
            project-runtime.tar.gz
            project-runtime.tar.gz.sha256
            ntanis.project.json
            ntanis-data-contract.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the runtime without executing it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-runtime

      - name: Verify transferred bytes
        run: sha256sum --check project-runtime.tar.gz.sha256

      - name: Configure pinned SSH transport
        env:
          SERVER_FINGERPRINT: ${{ inputs.server-fingerprint }}
          SERVER_HOST: ${{ inputs.server-host }}
          SERVER_SSH_KEY: ${{ secrets.server-ssh-key }}
          SERVER_USER: ${{ inputs.server-user }}
        run: |
          test -n "$SERVER_HOST"
          test "$SERVER_USER" = project-ci
          test -n "$SERVER_FINGERPRINT"
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$SERVER_HOST" > ~/.ssh/known_hosts.scan
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts.scan -E sha256 | awk '{print $2}')"
          test "$actual" = "$SERVER_FINGERPRINT"
          mv ~/.ssh/known_hosts.scan ~/.ssh/known_hosts

      - id: deploy
        name: Deploy with local and public health verification and rollback
        continue-on-error: true
        env:
          PROJECT: ${{ inputs.project }}
          RELEASE_ID: ${{ github.sha }}
          SERVER_HOST: ${{ inputs.server-host }}
          SERVER_USER: ${{ inputs.server-user }}
        run: |
          case "$PROJECT" in tempo|justdoit|lyrical|djtube) ;; *) exit 2 ;; esac
          test "${#RELEASE_ID}" -eq 40
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          artifact_sha256="$(sha256sum project-runtime.tar.gz | awk '{print $1}')"
          status=healthy
          failure_code=''
          if ! ssh "$SERVER_USER@$SERVER_HOST" "upload $PROJECT $RELEASE_ID" < project-runtime.tar.gz; then
            status=failed
            failure_code=upload_failed
          elif ! ssh "$SERVER_USER@$SERVER_HOST" "deploy $PROJECT $RELEASE_ID"; then
            status=failed
            failure_code=health_or_deploy_failed
          fi
          {
            echo "artifact-sha256=$artifact_sha256"
            echo "failure-code=$failure_code"
            echo "started-at=$started_at"
            echo "status=$status"
          } >> "$GITHUB_OUTPUT"
          test "$status" = healthy

      - name: Report the immutable deployment outcome to Hub
        if: always() && steps.deploy.outputs.status != ''
        env:
          ARTIFACT_SHA256: ${{ steps.deploy.outputs.artifact-sha256 }}
          FAILURE_CODE: ${{ steps.deploy.outputs.failure-code }}
          HUB_AUDIENCE: https://api.ntanis.dev/project-deployments
          PROJECT: ${{ inputs.project }}
          STARTED_AT: ${{ steps.deploy.outputs.started-at }}
          STATUS: ${{ steps.deploy.outputs.status }}
        run: |
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(printf '%s' "$HUB_AUDIENCE" | jq -sRr @uri)"
          oidc_token="$(curl --fail --silent --show-error --retry 3 --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$oidc_url" | jq -er .value)"
          environment="$(jq -cer 'if .schemaVersion == 2 then [.secrets[]? | {name,description:.purpose,required,sensitive:(.type == "secret"),type:(if .type == "secret" then "secret" else "string" end)}] else [.components[] | select(.id == "service") | .environment[]?] end' ntanis.project.json)"
          if [ -f ntanis-data-contract.json ]; then data_contract="$(jq -cer . ntanis-data-contract.json)"; else data_contract='null'; fi
          payload="$(jq -cn \
            --arg artifactSha256 "$ARTIFACT_SHA256" \
            --arg commit "$GITHUB_SHA" \
            --argjson environment "$environment" \
            --argjson dataContract "$data_contract" \
            --arg failureCode "$FAILURE_CODE" \
            --arg finishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg startedAt "$STARTED_AT" \
            --arg status "$STATUS" \
            '{artifactSha256:$artifactSha256,commit:$commit,dataContract:$dataContract,environment:$environment,finishedAt:$finishedAt,startedAt:$startedAt,status:$status} + (if $failureCode == "" then {} else {failureCode:$failureCode} end)')"
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $oidc_token" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.ntanis.dev/v1/deployments/$PROJECT/service"

      - name: Preserve failed deployment status
        if: always() && steps.deploy.outputs.status == 'failed'
        run: exit 1
