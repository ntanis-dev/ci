name: Report hosted deployment

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
      artifact-sha256:
        required: true
        type: string
      status:
        required: true
        type: string
      failure-code:
        required: false
        default: ''
        type: string
      started-at:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Validate report envelope
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact-sha256 }}
          COMPONENT: ${{ inputs.component }}
          FAILURE_CODE: ${{ inputs.failure-code }}
          PROJECT: ${{ inputs.project }}
          STATUS: ${{ inputs.status }}
        run: |
          [[ "$PROJECT" =~ ^[a-z][a-z0-9-]{1,31}$ ]]
          [[ "$COMPONENT" =~ ^[a-z][a-z0-9-]{0,31}$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$STATUS" == healthy || "$STATUS" == failed ]]
          if [ "$STATUS" = failed ]; then [[ "$FAILURE_CODE" =~ ^[a-z][a-z0-9_.-]{0,95}$ ]]; else test -z "$FAILURE_CODE"; fi
      - name: Report to Hub with repository-bound OIDC
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact-sha256 }}
          COMPONENT: ${{ inputs.component }}
          FAILURE_CODE: ${{ inputs.failure-code }}
          HUB_AUDIENCE: https://api.ntanis.dev/project-deployments
          PROJECT: ${{ inputs.project }}
          STARTED_AT: ${{ inputs.started-at }}
          STATUS: ${{ inputs.status }}
        run: |
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(printf '%s' "$HUB_AUDIENCE" | jq -sRr @uri)"
          oidc_token="$(curl --fail --silent --show-error --retry 3 --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$oidc_url" | jq -er .value)"
          payload="$(jq -cn \
            --arg artifactSha256 "$ARTIFACT_SHA256" \
            --arg commit "$GITHUB_SHA" \
            --arg failureCode "$FAILURE_CODE" \
            --arg finishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg startedAt "$STARTED_AT" \
            --arg status "$STATUS" \
            '{artifactSha256:$artifactSha256,commit:$commit,finishedAt:$finishedAt,status:$status}
              + (if $startedAt == "" then {} else {startedAt:$startedAt} end)
              + (if $failureCode == "" then {} else {failureCode:$failureCode} end)')"
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $oidc_token" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.ntanis.dev/v1/deployments/$PROJECT/$COMPONENT"

